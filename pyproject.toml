[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "demandwise"
version = "1.0.0"
description = "Hierarchical Demand Forecasting with Probabilistic Reconciliation and Inventory Decisions"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "M.Sc. Data Science Candidate (MDS-07)" }
]
dependencies = [
    "numpy>=1.26.4,<2.1.0",
    "pandas>=2.2.2,<3.0.0",
    "scipy>=1.13.0,<1.15.0",
    "scikit-learn>=1.5.0,<1.6.0",
    "statsmodels>=0.14.2",
    "lightgbm>=4.3.0",
    "streamlit>=1.36.0",
    "plotly>=5.22.0",
    "pydantic>=2.7.4",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.1",
    "python-dateutil>=2.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.setuptools.packages.find]
where = ["src"]
