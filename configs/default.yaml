# DemandWise Default Configuration
dataset:
  name: "retail_hierarchical_sample"
  start_date: "2023-01-01"
  end_date: "2023-12-31"
  frequency: "D"
  num_skus: 12
  num_stores: 4
  num_regions: 2
  random_seed: 42

hierarchy:
  levels:
    - name: "sku_store"
      description: "Bottom-level SKU by Store series"
    - name: "category"
      description: "Category aggregate series"
    - name: "store"
      description: "Store aggregate series"
    - name: "region"
      description: "Region aggregate series"
    - name: "total"
      description: "Top-level enterprise total"

forecasting:
  horizon_days: 14
  test_days: 28
  cv_splits: 3
  models:
    - "naive"
    - "seasonal_naive"
    - "croston"
    - "exponential_smoothing"
    - "lightgbm"
  confidence_intervals:
    - 0.80
    - 0.95

reconciliation:
  methods:
    - "bottom_up"
    - "top_down_proportions"
    - "mint_shrink"

inventory:
  service_level: 0.95
  lead_time_days: 5
  review_period_days: 7
  holding_cost_rate: 0.20
  stockout_penalty_multiplier: 2.5
